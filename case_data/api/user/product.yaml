# 商品接口数据驱动文件

search_product:
  # ✅ 用例 1：搜索 iPhone 正常返回
  - keyword: "iphone"
    expected:
      code: 200
      message: "操作成功"
      contain_key: "list"
      contain_field: ["id", "name", "price", "brandName"]
      name_keyword: "iPhone"

  # ✅ 用例 2：搜索 "小米" 正常返回
  - keyword: "小米"
    expected:
      code: 200
      message: "操作成功"
      contain_key: "list"
      contain_field: ["id", "name", "price", "brandName"]
      name_keyword: "小米"

  # ✅ 用例 3：搜索部分关键字 "phone"（模糊匹配）
  - keyword: "phone"
    expected:
      code: 200
      message: "操作成功"
      contain_key: "list"
      contain_field: ["id", "name", "price", "brandName"]
      name_keyword: "phone"

  # ✅ 用例 4：搜索不存在的商品关键字
  - keyword: "不存在的商品XYZ"
    expected:
      code: 200
      message: "操作成功"
      contain_key: "list"
      contain_field: []
      name_keyword: ""

  # ✅ 用例 5：搜索特殊字符
  - keyword: "@#$%"
    expected:
      code: 200
      message: "操作成功"
      contain_key: "list"
      contain_field: []
      name_keyword: ""

  # ✅ 用例 6：空字符串（返回全部商品）
  - keyword: ""
    expected:
      code: 200
      message: "操作成功"
      contain_key: "list"
      contain_field: ["id", "name", "price", "brandName"]
      name_keyword: ""



detail_product:
  # ✅ 用例 1：正常商品详情
  - product_id: 38
    expected:
      code: 200
      message: "操作成功"
      contain_field: ["id", "name", "price", "brandName", "productCategoryName"]
      id: 38

  # ✅ 用例 2：不存在的商品ID
  - product_id: 99999
    expected:
      code: 500
      message: "商品不存在"
      contain_field: []
      id: null

